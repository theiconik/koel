sonar.projectKey=theiconik_koel
sonar.organization=theiconik
sonar.projectName=koel
sonar.sourceEncoding=UTF-8

# Analyze both applications from the monorepo root.
sonar.sources=frontend,backend
sonar.tests=frontend,backend/tests

# Keep generated files, dependencies, docs, design references, local caches, and DB
# migration SQL out of static analysis so the score reflects application code.
sonar.exclusions=\
  frontend/.next/**,\
  frontend/out/**,\
  frontend/node_modules/**,\
  frontend/coverage/**,\
  frontend/public/**,\
  frontend/docs/**,\
  frontend/next-env.d.ts,\
  frontend/**/*.test.ts,\
  frontend/**/*.test.tsx,\
  frontend/**/*.spec.ts,\
  frontend/**/*.spec.tsx,\
  backend/.pytest_cache/**,\
  backend/__pycache__/**,\
  backend/**/__pycache__/**,\
  backend/venv/**,\
  backend/.venv/**,\
  backend/htmlcov/**,\
  backend/coverage.xml,\
  backend/test-results.xml,\
  backend/tests/**,\
  backend/docs/**,\
  backend/db/migrations/**,\
  koel-ui-design-system/**,\
  planning/**

sonar.test.inclusions=\
  frontend/**/*.test.ts,\
  frontend/**/*.test.tsx,\
  frontend/**/*.spec.ts,\
  frontend/**/*.spec.tsx,\
  backend/tests/**/*.py

sonar.coverage.exclusions=\
  frontend/**/*.test.ts,\
  frontend/**/*.test.tsx,\
  frontend/**/*.spec.ts,\
  frontend/**/*.spec.tsx,\
  frontend/vitest.config.ts,\
  frontend/vitest.setup.ts,\
  backend/tests/**,\
  backend/scripts/**,\
  backend/config/settings.py

# Coverage reports are generated by npm run test:coverage and pytest-cov.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml
sonar.python.version=3.14
