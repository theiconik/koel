<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>koel — app</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body, #root { margin:0; padding:0; height:100%; background: var(--bg); }
    *, *::before, *::after { box-sizing: border-box; }
    button:hover { filter: brightness(0.95); }
    button:active { transform: scale(0.98); }
    input:focus, textarea:focus { outline: none; border-color: rgba(26,26,46,0.4); box-shadow: 0 0 0 3px rgba(232,176,75,0.35); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="./Components.jsx"></script>
  <script type="text/babel">
    function App() {
      const [view, setView] = React.useState("home"); // home | survey | new | session | insights | settings
      const [activeNav, setActiveNav] = React.useState("home");
      if (view === "session") return <RespondentSession onBack={() => setView("new")}/>;
      return (
        <div style={{ display: "flex", height: "100vh", background: "#FAF7F2" }}>
          <Sidebar
            active={activeNav}
            onSelect={k => {
              if (k === "new") { setView("new"); setActiveNav("home"); }
              else { setActiveNav(k); setView(k); }
            }}
          />
          <main style={{ flex: 1, overflow: "auto", minWidth: 0 }}>
            {view === "home" && <DashboardHome onOpenSurvey={() => { setView("responses"); setActiveNav("responses"); }} onNew={() => setView("new")}/>}
            {view === "responses" && <ResponsesView onBack={() => { setView("home"); setActiveNav("home"); }} onOpenResponse={() => setView("session")}/>}
            {view === "new" && <NewSurveyView onBack={() => { setView("home"); setActiveNav("home"); }} onPublish={() => setView("session")}/>}
            {view === "insights" && <InsightsView/>}
            {view === "settings" && <SettingsView/>}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
