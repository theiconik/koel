<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:#FAF7F2">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
    <div style="background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(26,26,46,0.04);text-align:center">
      <div class="mono" style="font-size:10px;color:var(--fg3)">xs</div>
      <div style="font-size:12px;color:var(--fg2);margin-top:4px">1px · 2px · 4%</div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(26,26,46,0.06);text-align:center">
      <div class="mono" style="font-size:10px;color:var(--fg3)">sm</div>
      <div style="font-size:12px;color:var(--fg2);margin-top:4px">2 · 8 · 6%</div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(26,26,46,0.08);text-align:center">
      <div class="mono" style="font-size:10px;color:var(--fg3)">md</div>
      <div style="font-size:12px;color:var(--fg2);margin-top:4px">8 · 24 · 8%</div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:14px;box-shadow:0 20px 48px rgba(26,26,46,0.12);text-align:center">
      <div class="mono" style="font-size:10px;color:var(--fg3)">lg</div>
      <div style="font-size:12px;color:var(--fg2);margin-top:4px">20 · 48 · 12%</div>
    </div>
  </div>
  <div style="margin-top:18px;font-size:13px;color:var(--fg2)">warm-tinted (midnight α), never pure black. card = sm · popover = md · modal = lg.</div>
</div></body></html>
