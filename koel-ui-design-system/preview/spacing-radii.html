<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;text-align:center">
    <div><div style="background:#1A1A2E;height:60px;border-radius:4px"></div><div class="mono" style="margin-top:6px;font-size:10px">xs · 4</div></div>
    <div><div style="background:#1A1A2E;height:60px;border-radius:6px"></div><div class="mono" style="margin-top:6px;font-size:10px">sm · 6</div></div>
    <div><div style="background:#1A1A2E;height:60px;border-radius:10px"></div><div class="mono" style="margin-top:6px;font-size:10px">md · 10</div></div>
    <div><div style="background:#1A1A2E;height:60px;border-radius:16px"></div><div class="mono" style="margin-top:6px;font-size:10px">lg · 16</div></div>
    <div><div style="background:#1A1A2E;height:60px;border-radius:24px"></div><div class="mono" style="margin-top:6px;font-size:10px">xl · 24</div></div>
    <div><div style="background:#1A1A2E;height:60px;border-radius:999px"></div><div class="mono" style="margin-top:6px;font-size:10px">pill</div></div>
  </div>
  <div style="margin-top:14px;font-size:13px;color:var(--fg2)">cards = 16 · buttons/inputs = 10 · chips = pill. Don't mix 4 and pill in one view.</div>
</div></body></html>
