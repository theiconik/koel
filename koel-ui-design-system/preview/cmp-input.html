<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="max-width:420px">
    <label style="font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;color:#1A1A2E;display:block;margin-bottom:6px">Survey title</label>
    <input value="First customer interviews" style="font-family:'Manrope',sans-serif;font-size:15px;width:100%;padding:11px 14px;border:1px solid rgba(26,26,46,0.18);border-radius:10px;background:#fff;color:#1A1A2E;box-sizing:border-box">
    <div style="font-size:12px;color:#6F685B;margin-top:6px">Respondents see this at the top of their session.</div>
  </div>
  <div style="max-width:420px;margin-top:14px">
    <label style="font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;color:#1A1A2E;display:block;margin-bottom:6px">Email</label>
    <input value="not-an-email" style="font-family:'Manrope',sans-serif;font-size:15px;width:100%;padding:11px 14px;border:1px solid #B3412B;border-radius:10px;background:#fff;color:#1A1A2E;box-sizing:border-box">
    <div style="font-size:12px;color:#B3412B;margin-top:6px">That doesn't look like a valid email.</div>
  </div>
</div></body></html>
