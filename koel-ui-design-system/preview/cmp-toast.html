<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-direction:column;gap:10px;max-width:440px">
    <div style="background:#EAF1EC;border:1px solid rgba(74,124,89,0.25);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start">
      <span style="width:8px;height:8px;border-radius:50%;background:#4A7C59;margin-top:7px;flex-shrink:0"></span>
      <div><div style="font-size:14px;font-weight:600;color:#2F4D38">survey published.</div><div style="font-size:13px;color:#4A4538">37 respondents will get an invite within the hour.</div></div>
    </div>
    <div style="background:#F7E6E0;border:1px solid rgba(179,65,43,0.25);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start">
      <span style="width:8px;height:8px;border-radius:50%;background:#B3412B;margin-top:7px;flex-shrink:0"></span>
      <div><div style="font-size:14px;font-weight:600;color:#7A2818">couldn't reach the mic.</div><div style="font-size:13px;color:#4A4538">check your browser permissions, then try again.</div></div>
    </div>
    <div style="background:#1A1A2E;color:#FAF7F2;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start">
      <span style="width:8px;height:8px;border-radius:50%;background:#E8B04B;margin-top:7px;flex-shrink:0"></span>
      <div><div style="font-size:14px;font-weight:600">koel is listening.</div><div style="font-size:13px;color:rgba(250,247,242,0.7)">speak whenever you're ready — there's no timer.</div></div>
    </div>
  </div>
</div></body></html>
