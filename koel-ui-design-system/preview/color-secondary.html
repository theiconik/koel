<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:10px">
    <div style="flex:1;background:#4A7C59;border-radius:12px;height:100px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#FAF7F2">
      <div style="font-weight:600;font-size:13px">forest</div>
      <div class="mono" style="color:rgba(250,247,242,0.65)">#4A7C59</div>
    </div>
    <div style="flex:1;background:#F08A63;border-radius:12px;height:100px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#1A1A2E">
      <div style="font-weight:600;font-size:13px">coral</div>
      <div class="mono" style="color:rgba(26,26,46,0.6)">#F08A63</div>
    </div>
    <div style="flex:1;background:#2B2B2B;border-radius:12px;height:100px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#FAF7F2">
      <div style="font-weight:600;font-size:13px">ink</div>
      <div class="mono" style="color:rgba(250,247,242,0.65)">#2B2B2B</div>
    </div>
  </div>
  <div style="margin-top:14px;font-size:13px;color:var(--fg2);line-height:1.5">forest → success, used sparingly. coral lives inside the logo's voice waves. ink → body text, softer than pure black.</div>
</div></body></html>
