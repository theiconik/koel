<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
    <div style="background:#EAF1EC;border:1px solid rgba(74,124,89,0.2);border-radius:10px;padding:14px">
      <div style="display:flex;align-items:center;gap:6px;color:#4A7C59;font-weight:600;font-size:13px">
        <span style="width:8px;height:8px;border-radius:50%;background:#4A7C59"></span> success
      </div>
      <div class="mono" style="margin-top:8px">forest / #4A7C59</div>
    </div>
    <div style="background:#F7E6E0;border:1px solid rgba(179,65,43,0.2);border-radius:10px;padding:14px">
      <div style="display:flex;align-items:center;gap:6px;color:#B3412B;font-weight:600;font-size:13px">
        <span style="width:8px;height:8px;border-radius:50%;background:#B3412B"></span> danger
      </div>
      <div class="mono" style="margin-top:8px">#B3412B</div>
    </div>
    <div style="background:#FBF2DE;border:1px solid rgba(201,138,30,0.25);border-radius:10px;padding:14px">
      <div style="display:flex;align-items:center;gap:6px;color:#C98A1E;font-weight:600;font-size:13px">
        <span style="width:8px;height:8px;border-radius:50%;background:#C98A1E"></span> warning
      </div>
      <div class="mono" style="margin-top:8px">#C98A1E</div>
    </div>
  </div>
</div></body></html>
