<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:#E8B04B;color:#1A1A2E;border:none;border-radius:10px;padding:12px 20px;cursor:pointer">Start survey</button>
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:#1A1A2E;color:#FAF7F2;border:none;border-radius:10px;padding:12px 20px;cursor:pointer">Publish</button>
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:transparent;color:#1A1A2E;border:1px solid #1A1A2E;border-radius:10px;padding:11px 19px;cursor:pointer">Preview</button>
    <button style="font-family:'Manrope',sans-serif;font-weight:500;font-size:15px;background:transparent;color:#1A1A2E;border:none;border-radius:10px;padding:12px 14px;cursor:pointer">Cancel</button>
  </div>
  <div style="margin-top:14px;font-size:12px;color:var(--fg3);line-height:1.6">mango = the one most-important CTA · midnight = primary confirm · outline = secondary · ghost = tertiary. A page should rarely have two mango buttons.</div>
</div></body></html>
