<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <span style="font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;background:#F2EEE6;color:#4A4538;padding:5px 12px;border-radius:999px">draft</span>
    <span style="font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;background:#EAF1EC;color:#4A7C59;padding:5px 12px;border-radius:999px">● live</span>
    <span style="font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;background:#F7E6E0;color:#B3412B;padding:5px 12px;border-radius:999px">closed</span>
    <span style="font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;background:#1A1A2E;color:#FAF7F2;padding:5px 12px;border-radius:999px">new</span>
    <span style="font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;background:#E8B04B;color:#1A1A2E;padding:5px 12px;border-radius:999px">featured</span>
    <span style="font-family:'Manrope',sans-serif;font-size:12px;font-weight:500;background:transparent;color:#4A4538;border:1px solid rgba(26,26,46,0.15);padding:4px 11px;border-radius:999px">+ tag</span>
  </div>
  <div style="margin-top:14px;font-size:12px;color:var(--fg3)">status chips use the semantic bg + fg pair. live = forest with ● prefix.</div>
</div></body></html>
