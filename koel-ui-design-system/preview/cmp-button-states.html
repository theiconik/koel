<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:#E8B04B;color:#1A1A2E;border:none;border-radius:10px;padding:12px 20px">default</button>
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:#D89E34;color:#1A1A2E;border:none;border-radius:10px;padding:12px 20px">hover</button>
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:#C48B23;color:#1A1A2E;border:none;border-radius:10px;padding:12px 20px;transform:scale(0.98)">press</button>
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:#E8B04B;color:#1A1A2E;border:none;border-radius:10px;padding:12px 20px;box-shadow:0 0 0 3px rgba(232,176,75,0.35)">focus</button>
    <button style="font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;background:#E8E2D5;color:#A79E8C;border:none;border-radius:10px;padding:12px 20px">disabled</button>
  </div>
  <div style="margin-top:14px;font-size:12px;color:var(--fg3);line-height:1.6">hover darkens 6–8%. press darkens + scale(0.98), no translate. focus = 3px mango ring at 35%.</div>
</div></body></html>
