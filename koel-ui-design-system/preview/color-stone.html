<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px">
    <div style="background:#FAF7F2;border:1px solid var(--border);border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px">50</div></div>
    <div style="background:#F2EEE6;border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px">100</div></div>
    <div style="background:#E8E2D5;border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px">200</div></div>
    <div style="background:#D4CCBB;border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px">300</div></div>
    <div style="background:#A79E8C;border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px;color:#FAF7F2">400</div></div>
    <div style="background:#6F685B;border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px;color:#FAF7F2">500</div></div>
    <div style="background:#4A4538;border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px;color:#FAF7F2">600</div></div>
    <div style="background:#1F1D1A;border-radius:8px;height:72px;display:flex;flex-direction:column-reverse;padding:6px"><div class="mono" style="font-size:10px;color:#FAF7F2">800</div></div>
  </div>
  <div style="margin-top:14px;font-size:13px;color:var(--fg2);line-height:1.5">warm neutrals — biased toward cream, not grey. use for borders, dividers, disabled states, secondary text.</div>
</div></body></html>
