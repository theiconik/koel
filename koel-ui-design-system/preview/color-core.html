<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row" style="gap:10px">
    <div style="flex:2;background:#FAF7F2;border:1px solid var(--border);border-radius:12px;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px">
      <div style="font-weight:600;font-size:13px;color:#1A1A2E">cream</div>
      <div class="mono">#FAF7F2</div>
    </div>
    <div style="flex:1;background:#1A1A2E;border-radius:12px;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#FAF7F2">
      <div style="font-weight:600;font-size:13px">midnight</div>
      <div class="mono" style="color:rgba(250,247,242,0.6)">#1A1A2E</div>
    </div>
    <div style="flex:1;background:#E8B04B;border-radius:12px;height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#1A1A2E">
      <div style="font-weight:600;font-size:13px">mango</div>
      <div class="mono" style="color:rgba(26,26,46,0.6)">#E8B04B</div>
    </div>
  </div>
  <div style="margin-top:14px;font-size:13px;color:var(--fg2);line-height:1.5">60% cream · 30% midnight · 10% mango. never run all three at full strength in one block.</div>
</div></body></html>
