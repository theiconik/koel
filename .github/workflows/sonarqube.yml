name: SonarQube

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  scan:
    name: Analyze frontend and backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=Missing SONAR_TOKEN::Add repository secret SONAR_TOKEN in GitHub Actions secrets."
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "::error title=Missing SONAR_HOST_URL::Add repository variable SONAR_HOST_URL with a reachable http:// or https:// URL."
            exit 1
          fi

          case "$SONAR_HOST_URL" in
            http://*|https://*) ;;
            *)
              echo "::error title=Invalid SONAR_HOST_URL::SONAR_HOST_URL must start with http:// or https://."
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Test backend with coverage
        env:
          PYTHONPATH: backend
        run: >
          python -m pytest backend/tests
          --cov=backend
          --cov-report=xml:backend/coverage.xml
          --junitxml=backend/test-results.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
