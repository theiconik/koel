sonar.projectKey=koel-backend
sonar.projectName=koel-backend
sonar.sourceEncoding=UTF-8

# Backend-only analysis. Run sonar-scanner from backend/.
sonar.sources=.
sonar.tests=tests

sonar.exclusions=\
  .pytest_cache/**,\
  __pycache__/**,\
  **/__pycache__/**,\
  venv/**,\
  .venv/**,\
  htmlcov/**,\
  coverage.xml,\
  test-results.xml,\
  tests/**,\
  docs/**,\
  db/migrations/**

sonar.test.inclusions=tests/**/*.py

sonar.coverage.exclusions=\
  tests/**,\
  scripts/**,\
  config/settings.py

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.python.version=3.14
